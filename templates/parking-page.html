<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>__HOSTNAME_FQDN__</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Fond CSS animé (fonctionne même si le JS ci-dessous ne charge pas). -->
    <div class="bg-gradient"></div>

    <!-- Signature geo3d de yrbane, servie par GitHub via jsDelivr (toujours la
         dernière version). data-random = layout aléatoire à chaque chargement.
         La CSP scopée (.htaccess) autorise ce CDN pour la page parking. -->
    <canvas id="geo" data-random aria-hidden="true"></canvas>

    <div class="particles" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <main class="overlay">
        <h1 class="domain-title">__HOSTNAME_FQDN__</h1>
        <p class="subtitle">En construction</p>
        <div class="loader" aria-hidden="true">
            <span></span><span></span><span></span>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/gh/yrbane/geo3d@main/geo3d.js" defer></script>
</body>
</html>
